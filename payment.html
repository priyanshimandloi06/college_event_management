<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | CampusEvents</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="payment" data-nav="student">
  <nav class="navbar" data-render="nav"></nav>

  <main>
    <section class="page-header">
      <span class="eyebrow">Payment Confirmation</span>
      <h1 class="page-title">Complete your registration payment</h1>
      <p class="intro-text">This prototype simulates secure payment confirmation before generating the event pass.</p>
    </section>

    <section class="form-layout">
      <div class="form-panel">
        <h2>Payment Details</h2>
        <div id="paymentSummary" class="detail-list"></div>
      </div>

      <div class="form-panel">
        <div id="paymentMessage" class="hidden"></div>
        <form id="paymentForm" class="form-grid single">
          <div class="field">
            <label for="payerReference">Payment Reference</label>
            <input id="payerReference" name="payerReference" type="text" placeholder="UPI / card / transaction reference" required>
          </div>
          <div class="field">
            <label for="payerApproval">Confirmation</label>
            <select id="payerApproval" name="payerApproval" required>
              <option value="confirmed">Payment confirmed</option>
            </select>
          </div>
          <button class="btn" type="submit">Pay Now and Generate Pass</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer" data-render="footer"></footer>
  <script src="script.js"></script>
</body>
</html>
